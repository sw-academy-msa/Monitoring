# URL은 별도 secret 파일에서 읽으며 Webhook 생성 시 선택한 채널로 발송합니다.
global:
  resolve_timeout: 5m
route:
  receiver: slack-operations
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 합성 테스트는 실제 서비스 장애를 만들지 않고 발생/복구를 빠르게 확인합니다.
    - receiver: slack-operations
      matchers:
        - alertname="SlackDeliveryTest"
      group_by: [alertname, test_id]
      group_wait: 1s
      group_interval: 1s
      repeat_interval: 1h
receivers:
  - name: slack-operations
    slack_configs:
      - api_url_file: /run/secrets/alertmanager/slack-webhook-url
        # 현대 Incoming Webhook의 채널은 URL 생성 시 고정되므로 이름을 덮어쓰지 않습니다.
        channel: ''
        send_resolved: true
        title: '[STOCKDROP][{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        title_link: ''
        color: '{{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}'
        text: |-
          {{ range .Alerts }}*상태*: {{ .Status }}
          *심각도*: {{ .Labels.severity }}
          *대상*: {{ .Labels.job }} {{ .Labels.instance }}
          *내용*: {{ .Annotations.summary }}
          {{ end }}
