global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: prod
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'AccountService'
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/scrape-token
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8080
        filters:
          - name: tag:Project
            values: [STOCKDROP]
          - name: tag:Pool
            values: [general]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_instance_id]
        target_label: ec2_instance_id
      - source_labels: [__meta_ec2_availability_zone]
        target_label: availability_zone
      - target_label: pool
        replacement: general
      - target_label: service
        replacement: AccountService
  - job_name: 'ProductCommandService'
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/scrape-token
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8081
        filters:
          - name: tag:Project
            values: [STOCKDROP]
          - name: tag:Pool
            values: [purchase]
          - name: instance-state-name
            values: [running]
    relabel_configs:
