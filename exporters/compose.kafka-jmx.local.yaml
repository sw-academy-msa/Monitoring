# 기존 Kafka Compose 뒤에 병합합니다. agent 다운로드 후 명시 적용하면 브로커가 재시작됩니다.
services:
  kafka:
    environment:
      KAFKA_OPTS: -javaagent:/opt/monitoring/jmx_prometheus_javaagent.jar=9404:/opt/monitoring/kafka-jmx.yml
    ports: ["127.0.0.1:9404:9404"]
    volumes:
      - ../Monitoring/vendor/jmx_prometheus_javaagent.jar:/opt/monitoring/jmx_prometheus_javaagent.jar:ro
      - ../Monitoring/exporters/kafka-jmx.yml:/opt/monitoring/kafka-jmx.yml:ro
    # KAFKA_OPTS는 컨테이너의 모든 Java 도구에 적용되므로 healthcheck JVM이 9404를 선점해 브로커가 종료되지 않게 비웁니다.
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
