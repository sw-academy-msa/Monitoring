# 운영 대상 주소, IAM Role, 보안 그룹을 준비한 뒤 병합합니다.
services:
  prometheus:
    command: [--config.file=/etc/prometheus/config/prometheus.prod.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d, --storage.tsdb.retention.size=10GB]
    volumes:
      - ./prometheus/targets:/etc/prometheus/targets:ro

  grafana:
    # Grafana만 공개 바인딩하고 Prometheus는 loopback을 유지합니다.
    ports: !override ["${GRAFANA_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-3001}:3000"]
    environment:
      GF_SERVER_ROOT_URL: https://grafana.stockdrop.cloud
      GF_SERVER_DOMAIN: grafana.stockdrop.cloud
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
